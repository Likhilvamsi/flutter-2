name: Build and Deploy Flutter (Web + APK)

on:
  push:
    branches: ["main"]
    paths:
      - "lib/**"
      - "android/**"
      - "web/**"
      - "pubspec.yaml"
      - ".github/workflows/deploy.yml"

jobs:
  # =====================================
  # 🌐 BUILD & DEPLOY WEB FRONTEND
  # =====================================
  build-deploy-web:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v4

      - name: ⚡ Cache Flutter Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            /opt/hostedtoolcache/flutter
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🌐 Build Flutter Web
        run: flutter build web --release

      - name: 🧹 Clean Remote Frontend Folder
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🧹 Cleaning old frontend files..."
            sudo rm -rf ~/app/frontend/*

      - name: 🚀 Deploy Web Files to Azure VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/web/*"
          target: "~/app/frontend/"
          overwrite: true

      - name: 🔁 Restart Nginx
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🔁 Restarting Nginx..."
            sudo systemctl restart nginx
            echo "✅ Web app deployed successfully!"

  # =====================================
  # 📱 BUILD & UPLOAD ANDROID APK
  # =====================================
  build-apk:
    runs-on: ubuntu-latest
    needs: build-deploy-web  # remove this if you want parallel builds

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v4

      - name: ⚡ Cache Flutter Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            /opt/hostedtoolcache/flutter
          key: flutter-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: flutter-${{ runner.os }}-

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🤖 Build Android APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📦 Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: ☁️ Upload APK to Azure Blob Storage
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "☁️ Uploading APK to Azure Blob Storage..."
            az storage container create \
              --account-name appci \
              --name app \
              --auth-mode key \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }}
            TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
            FILE_NAME="app-release-${TIMESTAMP}.apk"
            az storage blob upload \
              --account-name appci \
              --container-name app \
              --name $FILE_NAME \
              --file build/app/outputs/flutter-apk/app-release.apk \
              --auth-mode key \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }}
            URL="https://appci.blob.core.windows.net/app/${FILE_NAME}"
            echo "✅ APK uploaded successfully: ${URL}"
            echo "DOWNLOAD_URL=${URL}" >> $GITHUB_ENV

      - name: ✅ Print APK Download URL
        run: echo "📱 New APK available at ${{ env.DOWNLOAD_URL }}"
