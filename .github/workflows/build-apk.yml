name: Build and Upload Flutter APK to Azure Blob

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Flutter SDK (includes Dart 3.8.1+)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Step 4: Build release APK
      - name: Build release APK
        run: flutter build apk --release

      # Step 5: Upload to GitHub artifacts (for CI viewing)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Step 6: Install Azure CLI
      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # Step 7: Upload APK to Azure Blob Storage (container: app)
      - name: Upload APK to Azure Blob Storage
        uses: azure/CLI@v2
        with:
          inlineScript: |
            STORAGE_ACCOUNT="appci"
            CONTAINER_NAME="app"
            APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
            BLOB_NAME="app-release-$(date +'%Y-%m-%d_%H-%M-%S').apk"

            echo "🔹 Ensuring container '$CONTAINER_NAME' exists..."
            az storage container create \
              --account-name $STORAGE_ACCOUNT \
              --name $CONTAINER_NAME \
              --auth-mode key \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
              --public-access blob

            echo "🔹 Uploading APK..."
            az storage blob upload \
              --account-name $STORAGE_ACCOUNT \
              --container-name $CONTAINER_NAME \
              --name $BLOB_NAME \
              --file $APK_FILE \
              --auth-mode key \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
              --overwrite

            echo "✅ Upload completed successfully."
            echo "🌐 Public APK URL:"
            echo "https://$STORAGE_ACCOUNT.blob.core.windows.net/$CONTAINER_NAME/$BLOB_NAME"

